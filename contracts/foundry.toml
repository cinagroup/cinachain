[profile.default]
src = "src"
out = "out"
script = "script"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
gas_reports = ["CinaNFT"]

# Base Mainnet (chainId 8453)
[profile.base]
eth_rpc_url = "${BASE_RPC_URL}"
etherscan_api_key = "${BASESCAN_API_KEY}"

# Base Sepolia testnet (chainId 84532)
[profile.base-sepolia]
eth_rpc_url = "${BASE_SEPOLIA_RPC_URL}"
etherscan_api_key = "${BASESCAN_API_KEY}"

# Ethereum Mainnet (legacy fallback)
[profile.mainnet]
eth_rpc_url = "${MAINNET_RPC_URL}"
