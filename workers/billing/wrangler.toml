name = "cinachain-billing"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "billing.cinachain.com"
custom_domain = true

[[routes]]
pattern = "billing-api.cinachain.com/*"
zone_name = "cinachain.com"

[[kv_namespaces]]
binding = "CINA_BILLING_KV"
id = "b7aaab94dc9f438c919ec40c53112d68"

[vars]
API_VERSION = "v1"
# CinaCredit the ledger treats as the on-chain ceiling (balanceOf + Transfer
# indexing). 2026-08-22 contract set; the request path re-reads balanceOf so
# existing ledger rows self-correct to the new contract on next use.
CINA_CREDIT_ADDRESS = "0x22f3e0aaa4785169d2c227d37df17c168fbae85a"
BASE_SEPOLIA_RPC = "https://sepolia.base.org"

# Account-level Secrets Store bindings. Only the store and secret names are
# committed here; secret values remain encrypted in Cloudflare Secrets Store.
[[secrets_store_secrets]]
binding = "ADMIN_KEY"
store_id = "346e2b4b86334bc29083c064116e91cf"
secret_name = "CINACHAIN_BILLING_ADMIN_KEY_V1"

[[secrets_store_secrets]]
binding = "INGRESS_ENC_KEY"
store_id = "346e2b4b86334bc29083c064116e91cf"
secret_name = "CINACHAIN_BILLING_INGRESS_ENC_KEY_V1"

[triggers]
crons = ["* * * * *"]
