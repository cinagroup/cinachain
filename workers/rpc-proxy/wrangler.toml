name = "rpc-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-29"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 0.1

# Serve on the DApp's RPC subdomain. The cinachain.com zone lives in the same
# Cloudflare account as the other Workers (cinachain-billing, media-gateway),
# so wrangler can create the custom domain + DNS record on deploy.
#
# NOTE: the obvious name `base-rpc.cinachain.com` is already occupied by a
# legacy Cloudflare Web3 Ethereum Gateway (proxies mainnet ETH), so wrangler
# cannot bind it. Use `rpc-proxy.cinachain.com` instead — no prior DNS/Web3
# config, so the custom domain binds cleanly.
[[routes]]
pattern = "rpc-proxy.cinachain.com"
custom_domain = true

# ALCHEMY_API_KEY is injected as a Worker secret from CI
# (`wrangler secret put ALCHEMY_API_KEY`). Never commit the key here.

# Per-IP rate limit (Workers rate-limiting binding — stable [[ratelimits]]
# config on wrangler 4.x; the old unsafe.bindings form is ignored as metadata).
# 120 requests / 60 s per client IP, enforced before the request body is read,
# so blocked requests cost no Alchemy quota. Counting is per-colo best-effort
# (Cloudflare's documented behaviour); the method allow-list and body caps
# bound what slips through. A dashboard WAF rate-limiting rule can be added
# later for global (cross-colo) enforcement.
[[ratelimits]]
name = "RPC_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
