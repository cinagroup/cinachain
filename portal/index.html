    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "CinaChain",
            "url": "https://cinachain.com",
            "logo": "https://cinachain.com/favicon.ico",
            "sameAs": [
              "https://github.com/cinagroup",
              "https://discord.gg/cinachain"
            ]
          },
          {
            "@type": "WebSite",
            "name": "CinaChain",
            "url": "https://cinachain.com/"
          }
        ]
      }
    </script>

    <!--
      Theme (no FOUC). Runs before first paint: reads the stored preference
      ("light" | "dark" | "system") and applies the resolved theme to <html
      data-theme>, which the design tokens and Tailwind dark variant key off
      of. Defaults to the OS preference. The in-app ModeToggle updates the
      same attribute and persists the choice to localStorage.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem("cinachain-theme")
          var pref =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system"
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          )
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
