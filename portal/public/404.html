<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found · CinaChain</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#060a12" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #060a12; color: #e2e8f0;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; letter-spacing: 3px; color: #50e3c2; text-transform: uppercase; }
    h1 { font-size: 64px; font-weight: 800; letter-spacing: -2px; color: #fff; margin: 16px 0 12px; }
    p { color: #94a3b8; font-size: 16px; max-width: 420px; line-height: 1.6; }
    .links { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-block; padding: 12px 24px; border-radius: 999px; font-size: 15px; font-weight: 600;
      text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: #fff; color: #060a12; }
    .btn-ghost { border: 1px solid rgba(255,255,255,0.2); color: #e2e8f0; }
    :focus-visible { outline: 2px solid #50e3c2; outline-offset: 2px; border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
  </style>
</head>
<body>
  <span class="code">404 · Not Found</span>
  <h1>This page drifted off-chain.</h1>
  <p>The address you followed doesn't exist — like a token sent to a counterfactual wallet.</p>
  <div class="links">
    <a class="btn btn-primary" href="/">Back to CinaChain</a>
    <a class="btn btn-ghost" href="https://nft.cinachain.com">Enter DApp</a>
  </div>
</body>
</html>
