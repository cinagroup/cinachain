name: Deploy contracts (Base Sepolia)

# Manual one-shot contract deployment using the deployer key stored in the
# DEPLOY_PRIVATE_KEY GitHub secret (per DEPLOYMENT.md §7: deploy keys live
# only in CI secrets, never in the repo or command lines).
#
# Runs scripts/deploy-all.mjs: deploys CinaNFT/CinaBadge/CinaCreditV2/CinaMega,
# initializes + locks Mega templates, verifies on-chain state, and writes the
# address summary to the run's step summary. Never touches the DApp config —
# updating .env.production and shipping the new addresses is a reviewed PR.
on:
  workflow_dispatch:
    inputs:
      resume_from_run:
        description: "Run ID of a previous deploy-contracts run to resume from (restores its receipt artifact)"
        required: false
        default: ""

concurrency:
  group: deploy-contracts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore deployment receipt (resume)
        if: inputs.resume_from_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: deployment-receipt
          path: contracts/out/
          run-id: ${{ inputs.resume_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build contract artifacts (solc-js)
        run: npm run contracts:build

      - name: Deploy all contracts
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_NETWORK: base-sepolia
          CINA_PROTOCOL_ADMIN_ADDRESS: ${{ vars.CINA_PROTOCOL_ADMIN_ADDRESS }}
          CINA_BADGE_MINTER_ADDRESS: ${{ vars.CINA_BADGE_MINTER_ADDRESS }}
          CINA_CREDIT_ADMIN_ADDRESS: ${{ vars.CINA_CREDIT_ADMIN_ADDRESS }}
          CINA_CREDIT_MINTER_ADDRESS: ${{ vars.CINA_CREDIT_MINTER_ADDRESS }}
          CINA_CREDIT_PAUSER_ADDRESS: ${{ vars.CINA_CREDIT_PAUSER_ADDRESS }}
        run: node scripts/deploy-all.mjs

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-receipt
          path: contracts/out/deployment.base-sepolia.json
          if-no-files-found: ignore
