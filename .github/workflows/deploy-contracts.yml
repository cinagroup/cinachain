name: Deploy contracts (Base Sepolia)

# Manual one-shot contract deployment using the deployer key stored in the
# DEPLOY_PRIVATE_KEY GitHub secret (per DEPLOYMENT.md §7: deploy keys live
# only in CI secrets, never in the repo or command lines).
#
# Runs scripts/deploy-all.mjs: deploys CinaNFT/CinaBadge/CinaCredit/CinaMega,
# initializes + locks Mega templates, verifies on-chain state, and writes the
# address summary to the run's step summary. Never touches the DApp config —
# updating .env.production and shipping the new addresses is a reviewed PR.
on:
  workflow_dispatch:

concurrency:
  group: deploy-contracts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build contract artifacts (solc-js)
        run: npm run contracts:build

      - name: Deploy all contracts
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_NETWORK: base-sepolia
        run: node scripts/deploy-all.mjs

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-receipt
          path: contracts/out/deployment.base-sepolia.json
          if-no-files-found: ignore
