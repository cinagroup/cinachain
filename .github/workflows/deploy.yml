name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build static export
        # .env.production (committed, public values only) provides the
        # NEXT_PUBLIC_* vars — mirrors the local build exactly.
        run: npm run build

      - name: Strip null bytes (Windows-safe webpack output)
        run: node scripts/strip-nulls.mjs

      # Debug: confirm secrets are present and wrangler can authenticate.
      # Secrets are masked in logs; this only checks presence + whoami.
      - name: Verify Cloudflare auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token_present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          echo "account_present=${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
          npx --yes wrangler@3 whoami 2>&1 | tail -8
          echo "wrangler_exit=$?"
          echo "--- pages projects ---"
          npx --yes wrangler@3 pages project list 2>&1 | head -30
          echo "project_list_exit=$?"

      # Direct wrangler invocation instead of wrangler-action — the action's
      # internal npm bootstrap failed on the runner (exit 1), breaking every
      # deploy since M1. npx resolves the pinned wrangler@3 from the worker's
      # lockfile and needs no action wrapper. Create the project if missing
      # (all historical deploys failed — likely the project never existed).
      # Diagnostic: capture output into the step summary (API-readable,
      # bypasses the login-gated log page) while still failing the job.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "### pages project list"
            npx --yes wrangler@3 pages project list 2>&1 | head -30
            echo "### creating if missing"
            npx --yes wrangler@3 pages project list 2>/dev/null | grep -q "cinachain-dapp-v2" || npx --yes wrangler@3 pages project create cinachain-dapp-v2 --production-branch=main 2>&1 | head -20
            echo "### deploy"
            npx --yes wrangler@3 pages deploy out --project-name=cinachain-dapp-v2 --commit-dirty=true 2>&1
            echo "### deploy_exit=$?"
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          exit 1

      # Billing worker (metering gateway + scheduled indexer). Only on push
      # to main — PRs get no worker deploy (no preview environment).
      - name: Deploy billing worker
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/billing
        run: npx --yes wrangler@3 deploy
