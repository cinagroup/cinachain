name: Verify and deploy CinaChain

on:
  push:
    branches: [main, integrations]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# All deploy jobs run in parallel. The DApp static build is fragile on the
# runner (a webpack module-resolution quirk in the Reown/wagmi chain), so the
# portal/docs/workers are decoupled into their own jobs — a DApp build failure
# must not block shipping the brand portal, docs site, or edge workers.
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install billing Worker dependencies
        working-directory: workers/billing
        run: npm ci --ignore-scripts

      - name: Verify generated design tokens
        run: npm run design:tokens:check

      - name: Verify current repository files contain no Worker secrets
        run: npm run security:config

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck RPC proxy Worker
        run: npx --no-install tsc -p workers/rpc-proxy/tsconfig.json --pretty false

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci --legacy-peer-deps

      - name: Build docs
        working-directory: docs-site
        run: npm run build

  dapp:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Install locked deployment CLI
        working-directory: workers/billing
        run: npm ci --ignore-scripts

      - name: Check CinaAuth client id
        # The OAuth client id is public but must be baked into the static
        # export; an empty value silently ships sign-in disabled.
        env:
          CINAAUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_CINAAUTH_CLIENT_ID }}
        run: |
          if [ -z "$CINAAUTH_CLIENT_ID" ]; then
            echo "::error::GitHub secret NEXT_PUBLIC_CINAAUTH_CLIENT_ID is not set — CinaAuth sign-in would ship disabled."
            exit 1
          fi

      - name: Build static export
        # .env.production (committed, public values only) provides the
        # NEXT_PUBLIC_* vars — mirrors the local build exactly. The Alchemy key
        # is no longer a build-time var; it is injected into the rpc-proxy
        # Worker (see the workers job below) and the DApp reaches it via
        # NEXT_PUBLIC_BASE_RPC, so the key never enters the frontend bundle.
        # Process env (CinaAuth client id) takes precedence over .env files.
        env:
          NEXT_PUBLIC_CINAAUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_CINAAUTH_CLIENT_ID }}
        run: npm run build

      - name: Strip null bytes (Windows-safe webpack output)
        run: node scripts/strip-nulls.mjs

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projects="$(./workers/billing/node_modules/.bin/wrangler pages project list)"
          if ! grep -q "cinachain-dapp-v2" <<< "$projects"; then
            echo "Pages project missing — creating cinachain-dapp-v2"
            ./workers/billing/node_modules/.bin/wrangler pages project create cinachain-dapp-v2 --production-branch=main
          fi
          ./workers/billing/node_modules/.bin/wrangler pages deploy out --project-name=cinachain-dapp-v2 --branch=main --commit-hash="$GITHUB_SHA"

  workers:
    needs: quality
    # Edge workers depend only on their own wrangler + the committed source —
    # independent of the Next.js build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install billing Worker dependencies
        working-directory: workers/billing
        run: npm ci --ignore-scripts

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi
          echo "The deployment token must include Account Secrets Store Edit; Read alone cannot deploy a Secrets Store Worker binding."

      - name: Verify Billing Secrets Store metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run secrets:billing:check

      # Billing worker (metering gateway + scheduled indexer).
      - name: Deploy billing worker
        working-directory: workers/billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      # Media gateway worker (CinaMega R2 → 4EVERLAND → on-chain fallback).
      - name: Deploy media-gateway worker
        working-directory: workers/media-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../billing/node_modules/.bin/wrangler deploy

      # RPC proxy worker (DApp → base-rpc.cinachain.com → Alchemy server-side).
      # Eliminates browser CORS / referrer-allowlist failures and keeps the
      # Alchemy key out of the frontend bundle. The key is reused from the same
      # GitHub secret; it is now a Worker secret rather than a NEXT_PUBLIC_ var.
      - name: Deploy rpc-proxy worker
        working-directory: workers/rpc-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ../billing/node_modules/.bin/wrangler deploy
          # Inject the Alchemy key as a Worker secret (never in wrangler.toml,
          # never in the frontend bundle). Piped via stdin so the value does
          # not appear in process args or logs.
          printf '%s\n' "${{ secrets.NEXT_PUBLIC_ALCHEMY_API_KEY }}" | ../billing/node_modules/.bin/wrangler secret put ALCHEMY_API_KEY

      # Auth proxy worker (same-origin /api/auth/* forwarder to CinaAuth,
      # required for the DApp's OIDC browser flow — see DEPLOYMENT.md §2).
      - name: Deploy auth-proxy worker
        working-directory: workers/auth-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../billing/node_modules/.bin/wrangler deploy

      # Confidential OAuth client: the proxy injects client_secret_basic on
      # token requests, so the secret lives only as a Worker secret — never
      # in the static export. Empty CINAAUTH_CLIENT_SECRET = public client
      # (passthrough mode).
      - name: Provision auth-proxy CinaAuth credentials
        working-directory: workers/auth-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINAAUTH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_CINAAUTH_CLIENT_ID }}
          CINAAUTH_CLIENT_SECRET: ${{ secrets.CINAAUTH_CLIENT_SECRET || secrets.NEXT_PUBLIC_CINAAUTH_CLIENT_SECRET }}
        run: |
          if [ -n "$CINAAUTH_CLIENT_ID" ]; then
            printf '%s' "$CINAAUTH_CLIENT_ID" | ../billing/node_modules/.bin/wrangler secret put CINAAUTH_CLIENT_ID
          else
            echo "::warning::NEXT_PUBLIC_CINAAUTH_CLIENT_ID not set — auth-proxy cannot authenticate confidential clients."
          fi
          if [ -n "$CINAAUTH_CLIENT_SECRET" ]; then
            printf '%s' "$CINAAUTH_CLIENT_SECRET" | ../billing/node_modules/.bin/wrangler secret put CINAAUTH_CLIENT_SECRET
          else
            echo "::warning::Neither CINAAUTH_CLIENT_SECRET nor NEXT_PUBLIC_CINAAUTH_CLIENT_SECRET is set — running the proxy in public-client passthrough mode."
          fi

  portal:
    needs: quality
    # Brand portal (cinachain.com). The reviewed 1200x630 social card is tracked
    # in portal/ so CI cannot replace the official logo with generated artwork.
    # Ships regardless of the DApp build state.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install locked deployment CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: workers/billing
        run: npm ci --ignore-scripts

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Build portal (Vite static export)
        working-directory: portal
        run: npm run build

      - name: Deploy portal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projects="$(./workers/billing/node_modules/.bin/wrangler pages project list)"
          if ! grep -q "cinachain-portal" <<< "$projects"; then
            ./workers/billing/node_modules/.bin/wrangler pages project create cinachain-portal --production-branch=main
          fi
          ./workers/billing/node_modules/.bin/wrangler pages deploy portal/dist --project-name=cinachain-portal --branch=main --commit-hash="$GITHUB_SHA"

  docs:
    needs: [quality, docs-build]
    # Documentation site (docs.cinachain.com, Docusaurus). Builds in its own
    # directory with its own lockfile — independent of the DApp.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install locked deployment CLI
        working-directory: workers/billing
        run: npm ci --ignore-scripts

      - name: Build & deploy docs
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --legacy-peer-deps
          npm run build
          projects="$(../workers/billing/node_modules/.bin/wrangler pages project list)"
          if ! grep -q "cinachain-docs" <<< "$projects"; then
            ../workers/billing/node_modules/.bin/wrangler pages project create cinachain-docs --production-branch=main
          fi
          ../workers/billing/node_modules/.bin/wrangler pages deploy build --project-name=cinachain-docs --branch=main --commit-hash="$GITHUB_SHA"
