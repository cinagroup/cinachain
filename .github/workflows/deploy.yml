name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All deploy jobs run in parallel. The DApp static build is fragile on the
# runner (a webpack module-resolution quirk in the Reown/wagmi chain), so the
# portal/docs/workers are decoupled into their own jobs — a DApp build failure
# must not block shipping the brand portal, docs site, or edge workers.
jobs:
  dapp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build static export
        # .env.production (committed, public values only) provides the
        # NEXT_PUBLIC_* vars — mirrors the local build exactly.
        run: npm run build

      - name: Strip null bytes (Windows-safe webpack output)
        run: node scripts/strip-nulls.mjs

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@3 pages project list 2>/dev/null | grep -q "cinachain-dapp-v2"; then
            echo "Pages project missing — creating cinachain-dapp-v2"
            npx --yes wrangler@3 pages project create cinachain-dapp-v2 --production-branch=main
          fi
          npx --yes wrangler@3 pages deploy out --project-name=cinachain-dapp-v2 --commit-dirty=true

  workers:
    # Edge workers depend only on their own wrangler + the committed source —
    # independent of the Next.js build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi

      # Billing worker (metering gateway + scheduled indexer).
      - name: Deploy billing worker
        working-directory: workers/billing
        run: npx --yes wrangler@3 deploy

      # Media gateway worker (CinaMega R2 → 4EVERLAND → on-chain fallback).
      - name: Deploy media-gateway worker
        working-directory: workers/media-gateway
        run: |
          npx --yes wrangler@3 r2 bucket create cinachain-mega-media || true
          npx --yes wrangler@3 deploy

  portal:
    # Brand portal (cinachain.com). The reviewed 1200x630 social card is tracked
    # in portal/ so CI cannot replace the official logo with generated artwork.
    # Ships regardless of the DApp build state.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@3 pages project list 2>/dev/null | grep -q "cinachain-portal"; then
            npx --yes wrangler@3 pages project create cinachain-portal --production-branch=main
          fi
          npx --yes wrangler@3 pages deploy portal --project-name=cinachain-portal --commit-dirty=true

  docs:
    # Documentation site (docs.cinachain.com, Docusaurus). Builds in its own
    # directory with its own lockfile — independent of the DApp.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build & deploy docs
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --legacy-peer-deps
          npx docusaurus build
          if ! npx --yes wrangler@3 pages project list 2>/dev/null | grep -q "cinachain-docs"; then
            npx --yes wrangler@3 pages project create cinachain-docs --production-branch=main
          fi
          npx --yes wrangler@3 pages deploy build --project-name=cinachain-docs --commit-dirty=true
