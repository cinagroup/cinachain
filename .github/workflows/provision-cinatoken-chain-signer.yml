name: Provision CinaToken chain signer

on:
  workflow_dispatch:

concurrency:
  group: provision-cinatoken-chain-signer
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install signer verification dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Verify signer against receipt and live contract owners
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: node scripts/verify-cinatoken-signer.mjs

      - name: Install pinned Wrangler
        run: npm ci --prefix workers/billing --ignore-scripts

      - name: Provision isolated CinaToken Chain Worker signer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$DEPLOY_PRIVATE_KEY"
          printf '%s' "$DEPLOY_PRIVATE_KEY" | ./workers/billing/node_modules/.bin/wrangler secret put CINACHAIN_MINTER_PRIVATE_KEY --name cinatoken-chain-worker

      - name: Verify remote secret name
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ./workers/billing/node_modules/.bin/wrangler secret list --name cinatoken-chain-worker --format json > "$RUNNER_TEMP/cinatoken-chain-secret-names.json"
          node -e 'const fs=require("node:fs"); const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!rows.some((row)=>row.name==="CINACHAIN_MINTER_PRIVATE_KEY")) process.exit(1)' "$RUNNER_TEMP/cinatoken-chain-secret-names.json"
